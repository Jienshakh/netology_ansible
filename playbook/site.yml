---
- name: Install Nginx
  hosts: lighthouse
  handlers:
    - name: Start-nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
    - name: Reload-nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: reloaded
  tasks:
    - name: Install and configure nginx
      tags: nginx
      block:
        - name: NGINX | install epel-release
          become: true
          ansible.builtin.yum:
            name: epel-release
            state: present
        - name: NGINX | install NGINX
          become: true
          ansible.builtin.yum:
            name: nginx
            state: present
          notify: Start-nginx
        - name: NGINX | create general config
          become: true
          ansible.builtin.template:
            src: templates/nginx.conf.j2
            dest: /etc/nginx/nginx.conf
            mode: '0644'
          notify: Reload-nginx
- name: Install ligthouse
  hosts: lighthouse
  handlers:
    - name: Reload-nginx
      become: true
      ansible.builtin.command: nginx -s reload
      changed_when: false
  pre_tasks:
    - name: Lighthouse | Install dependencies
      become: true
      ansible.builtin.yum:
        name: git
        state: present
  tasks:
    - name: Install and configure ligthouse
      tags: ligthouse
      block:
        - name: Lighthouse | Copy from git
          become: true
          ansible.builtin.git:
            repo: "{{ lighthouse_vcs }}"
            version: master
            dest: "{{ lighthouse_location_dir }}"
        - name: Lighthouse | Create lighthouse config
          become: true
          ansible.builtin.template:
            src: templates/lighthouse.conf.j2
            dest: /etc/nginx/conf.d/default.conf
            mode: '0644'
          notify: Reload-nginx
- name: Install Clickhouse
  hosts: clickhouse
  handlers:
    - name: Start (restart) clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Download, install and configure clickhouse
      tags: clickhouse
      block:
        - name: Download clickhouse
          block:
            - name: Get clickhouse distrib
              ansible.builtin.get_url:
                url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.noarch.rpm"
                dest: "./{{ item }}-{{ clickhouse_version }}.rpm"
                mode: '0644'
              with_items: "{{ clickhouse_packages }}"
          rescue:
            - name: Get clickhouse distrib
              ansible.builtin.get_url:
                url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
                dest: "./clickhouse-common-static-{{ clickhouse_version }}.rpm"
                mode: '0644'
        - name: Install clickhouse packages
          become: true
          ansible.builtin.dnf:
            name:
              - clickhouse-common-static-{{ clickhouse_version }}.rpm
              - clickhouse-client-{{ clickhouse_version }}.rpm
              - clickhouse-server-{{ clickhouse_version }}.rpm
            disable_gpg_check: true
          notify: Start (restart) clickhouse service
        - name: Flush handlers
          ansible.builtin.meta: flush_handlers
        - name: Wait for ClickHouse TCP port
          ansible.builtin.wait_for:
            port: 9000
            delay: 5
            timeout: 60
        - name: Create database
          ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
          register: create_db
          failed_when: create_db.rc != 0 and create_db.rc != 82
          changed_when: create_db.rc == 0
        - name: Create table
          ansible.builtin.command: >
            clickhouse-client -q
            "CREATE TABLE IF NOT EXISTS logs.logs
            (message String) ENGINE = MergeTree()
            ORDER BY tuple();"
          register: create_table
          changed_when: false
        - name: Enable ClickHouse external access
          become: true
          ansible.builtin.blockinfile:
            path: /etc/clickhouse-server/config.xml
            block: |
              <listen_host>::1</listen_host>
              <listen_host>0.0.0.0</listen_host>
            insertafter: '<http_port>8123</http_port>'
          notify: Start (restart) clickhouse service
- name: Install Vector
  hosts: vector
  vars:
    clickhouse_host: "{{ hostvars['clickhouse-01'].ansible_host }}"
  handlers:
    - name: Start (restart) vector service
      become: true
      ansible.builtin.service:
        name: vector
        state: restarted
  tasks:
    - name: Download, Install and configure vector
      tags: vector
      block:
        - name: Download and Install vector
          block:
            - name: Get vector distrib
              ansible.builtin.get_url:
                url: "https://yum.vector.dev/stable/vector-0/x86_64/vector-{{ vector_version }}.x86_64.rpm"
                dest: "./vector-{{ vector_version }}.rpm"
                mode: '0644'
            - name: Install vector
              become: true
              ansible.builtin.yum:
                name:
                  - vector-{{ vector_version }}.rpm
                disable_gpg_check: true
              notify: Start (restart) vector service
            - name: Flush handlers
              ansible.builtin.meta: flush_handlers
        - name: Create Vector config directory
          become: true
          ansible.builtin.file:
            path: /etc/vector
            state: directory
            mode: '0755'
        - name: Deploy Vector configuration
          become: true
          ansible.builtin.template:
            src: vector.yaml.j2
            dest: /etc/vector/vector.yaml
            mode: '0644'
          notify: Start (restart) vector service
        - name: Ensure Vector is running
          become: true
          ansible.builtin.service:
            name: vector
            state: started
            enabled: true
